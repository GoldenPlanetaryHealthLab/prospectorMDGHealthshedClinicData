project:
  type: book
  output-dir: ../docs
  render:
    - "*.qmd"

# Rendering documents and emits selected project files. It never initializes
# R or executes the scientific pipeline.
engine: markdown

profile:
  default: authoring

book:
  title: "Madagascar Healthshed Clinic Data Manual"
  author: "Tinashe M. Tapera"
  date: last-modified
  chapters:
    - index.qmd
    - part: "Accessing and using the data"
      chapters:
        - 00_access-data.qmd
        - 00_data-guide.qmd
    # Quarto books have one level of parts. Prefix the three operator groups
    # consistently to distinguish them from the data-user section.
    - part: "Operating the pipeline: Setup"
      chapters:
        - 00_cover.qmd
        - 01_misc-render-isolated.qmd
        - 02_misc-project-contract.qmd
        - 03_misc-data-governance.qmd
        - pipeline/mapping/legacy-pipeline-map.qmd
    - part: "Operating the pipeline: Infrastructure"
      chapters:
        - infrastructure/10_page-direnv.qmd
        - infrastructure/11_page-spack.qmd
        - infrastructure/12_page-jinja.qmd
        - infrastructure/13_page-jinja-build.qmd
        - infrastructure/14_page-uvr.qmd
        - infrastructure/15_page-runner.qmd
    - part: "Operating the pipeline: Pipeline"
      chapters:
        - pipeline/16_page-stage-inputs.qmd
        - pipeline/17_page-inspect-source-data.qmd
        - pipeline/18_page-prep-w3.qmd
        - pipeline/19_page-clean-mapping-dhis2-gesis.qmd
        - pipeline/20_page-construct-clinic-ids.qmd
        - pipeline/21_page-construct-diagnosis-dictionary.qmd
        - pipeline/22_page-clean-clinic-diagnosis.qmd
        - pipeline/23_page-construct-healthsheds.qmd
        - pipeline/24_page-locate-clinics.qmd
        - pipeline/25_page-combine-clinic-metadata.qmd
        - pipeline/26_page-prep-2025-2026.qmd
        - pipeline/27_page-clean-2025-2026.qmd
        - pipeline/28_page-geospatial-aggregate-2025-2026.qmd
        - pipeline/30_page-validate-migration.qmd
        - releases/19_page-package-release.qmd
        - releases/20_page-execute-pipeline.qmd
        - releases/21_page-verify-release.qmd
        - releases/22_page-export-frictionless.qmd
        - 04_misc-data-guide-evidence.qmd

execute:
  enabled: false

format:
  GoldenPlanetaryHealthLab/quarto-manual-html: default
